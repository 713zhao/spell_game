name: spell_game
description: Game-based spelling app for kids.
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.0

  # HTTP client
  http: ^1.1.0

  # JSON serialization
  json_annotation: ^4.12.0
  json_serializable: ^6.0.0

  # Local storage
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0

  # Animations
  lottie: ^2.0.0

  # Audio
  # Note: audioplayers ^4.x requires http ^0.13.x, but this project uses http ^1.1.0
  # which is incompatible. Therefore, audioplayers ^5.0.0 is required.
  audioplayers: ^5.0.0

  # UI
  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/animations/
