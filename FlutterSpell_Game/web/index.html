<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutterspell_game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutterspell_game</title>
  <link rel="manifest" href="manifest.json">

  <!-- Stroke-order data/animation for the handwriting-trace exercise
       (lib/widgets/hanzi_writer_trace.dart). Pinned versions so a CDN
       release doesn't silently change quiz behavior underneath us. -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>

  <!-- This build no longer registers a service worker (built with
       --pwa-strategy=none), but a device that visited before this change
       may still have one active from an earlier build, silently serving
       stale cached JS forever regardless of how many times the page is
       reloaded. Unregistering it here is a one-time self-heal - once it's
       gone, ordinary reloads go straight to the network like a normal
       page. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const reg of regs) reg.unregister();
      });
    }
    if (window.caches) {
      caches.keys().then((keys) => {
        for (const key of keys) caches.delete(key);
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
